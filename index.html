<title>தமிழக முன்னேற்றக் கழகம்</title>
</head>
<body>
<h1>தமிழக முன்னேற்றக் கழகம்</h1>
<h2>மக்கள் முன்னேற்றமே எங்கள் இலக்கு</h2>

<p>தலைவர்: செங்கம் கே. ராஜாராம்</p>

<h3>எங்கள் நோக்கங்கள்</h3>
<ul>
<li>சமூக நீதி</li>
<li>இளைஞர் முன்னேற்றம்</li>
<li>கல்வி வளர்ச்சி</li>
<li>வேலைவாய்ப்பு</li>
</ul>

</body>
</html>
